name: Taskrabbit-Daten aktualisieren

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-taskrabbit-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Taskrabbit-Daten prüfen
        run: node scripts/update-taskrabbit-stats.mjs

      - name: Änderungen speichern
        run: |
          if git diff --quiet -- assets/taskrabbit-stats.json; then
            echo "Keine Änderungen."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/taskrabbit-stats.json
          git commit -m "Taskrabbit-Bewertung automatisch aktualisieren"
          git push
